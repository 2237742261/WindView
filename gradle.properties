org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 本机 SDK 最高 android-36，靠这个开关放行依赖里的 compileSdk 校验
android.experimental.disableCompileSdkChecks=true
# maven 上的 aapt2 只有 x86_64（arm64 跑不了）→ 用 qemu-user 包装（/workspace/sdk/aapt2）
android.aapt2FromMavenOverride=/dev/ws/sdk/aapt2
android.overridePathCheck=true
kotlin.code.style=official
